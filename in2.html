        <h3 class="mb-4 pt-2 pt-lg-0">下方文章帶你了解蘋果酒</h3>
        <p class="mb-4">
          1.乾淨比技術重要:在釀酒過程最怕雜菌汙染，使用的器具一定要經過消毒，不然會變成果醋或是風味異常
        </p>
        <p class="mb-4">
          2.酒會長大:剛釀造好的酒味較為強烈，但在經過一段時間後會變得更加柔順，這個過程稱為「熟成」
        </p>
        <p class="mb-0">
          3.氣泡不一定代表壞掉:在釀造過程中有氣泡的產生很正常，那是因為酵母在呼吸它在工作，如果是裝瓶後還持續產生氣泡，是因為發酵還未完成
        </p>
